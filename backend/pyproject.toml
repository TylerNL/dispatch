[project]
name = "dispatch-backend"
version = "0.1.0"
description = "RAG backend for dispatch — ingest, index, ask, digest."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "anthropic>=0.40",
  "tiktoken>=0.8",
  "feedparser>=6.0",
  "beautifulsoup4>=4.12",
  "apscheduler>=3.10",
  "python-dotenv>=1.0",
  "greenlet>=3.4.0",
  "openai>=2.37.0",
  "pyjwt[crypto]>=2.13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
